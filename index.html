<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luna Catálogo</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background-color: #0d1117;
            background-image: url('luna_vertical.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #c9d1d9;
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            min-height: 100vh;
        }
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(13, 17, 23, 0.70);
            z-index: -1;
        }
        .header { text-align: center; margin-bottom: 25px; max-width: 450px; width: 100%; }
        .header h1 { color: #f1c40f; font-size: 1.8rem; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
        .alerta-ubicacion { background-color: rgba(241, 196, 15, 0.15); border: 1px solid #f1c40f; color: #f1c40f; padding: 10px; border-radius: 8px; font-size: 0.95rem; font-weight: bold; margin-top: 10px; display: block; }
        .catalogo-container { max-width: 450px; width: 100%; display: flex; flex-direction: column; gap: 20px; padding-bottom: 40px; }
        .producto-card { background-color: rgba(22, 27, 34, 0.9); border: 1px solid #30363d; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .producto-card h2 { font-size: 1.2rem; color: #ffffff; padding: 15px 15px 5px 15px; }
        .img-contenedor { width: 100%; padding: 10px 15px; }
        .img-contenedor img { width: 100%; border-radius: 8px; display: block; object-fit: cover; }
        .precio-box { padding: 5px 15px 15px 15px; display: flex; align-items: baseline; gap: 10px; }
        .precio-antiguo { color: #8b949e; text-decoration: line-through; font-size: 1rem; }
        .precio-actual { color: #58a6ff; font-size: 1.5rem; font-weight: bold; }
        .btn-cupon { display: block; width: calc(100% - 30px); margin: 0 15px 15px 15px; background-color: #f1c40f; color: #0d1117; border: none; padding: 12px; font-size: 1rem; font-weight: bold; border-radius: 8px; cursor: pointer; text-align: center; text-decoration: none; transition: background 0.2s; }
        .btn-cupon:active { background-color: #d4ac0d; }
        .btn-agotado { background-color: #484f58; color: #8b949e; cursor: not-allowed; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
        .modal-content { background-color: #161b22; border: 2px solid #f1c40f; padding: 25px; border-radius: 12px; text-align: center; max-width: 350px; width: 100%; }
        .modal-content h3 { color: #f1c40f; margin-bottom: 10px; }
        .codigo-cupon { font-size: 1.6rem; font-weight: bold; color: #58a6ff; margin: 15px 0; letter-spacing: 2px; border: 2px dashed #30363d; padding: 10px; background-color: #0d1117; }
        .modal-content p { font-size: 0.9rem; color: #8b949e; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Luna Catálogo</h1>
        <div class="alerta-ubicacion">📍 Disponible solo para recogida en Pinar del Río (Ciudad)</div>
    </div>

    <div class="catalogo-container">
        <!-- Producto Principal: Moto Eléctrica -->
        <div class="producto-card">
            <h2>Moto Eléctrica</h2>
            <div class="img-contenedor"><img src="placeholder.jpg" alt="Moto Eléctrica"></div>
            <div class="precio-box">
                <span class="precio-antiguo">$630 USD</span>
                <span class="precio-actual">$600 USD</span>
            </div>
            <button class="btn-cupon" onclick="procesarCupon('Moto Eléctrica ($600)', 'LUNA-MOTO-600')">Generar Cupón de Descuento ($600)</button>
        </div>

        <!-- Segundo Producto: Agotado / Espacio anterior -->
        <div class="producto-card" style="opacity: 0.7;">
            <h2>Espacio Disponible (Agotado)</h2>
            <div class="img-contenedor"><img src="placeholder.jpg" alt="Agotado"></div>
            <div class="precio-box">
                <span class="precio-antiguo">$0 USD</span>
                <span class="precio-actual">$0 USD</span>
            </div>
            <button class="btn-cupon btn-agotado" disabled>Producto Agotado</button>
        </div>
    </div>

    <div id="miModal" class="modal">
        <div class="modal-content">
            <h3>¡Cupón Generado!</h3>
            <p>Tu código único de reserva es:</p>
            <div id="codigoBox" class="codigo-cupon">------</div>
            <p>Redirigiendo automáticamente a WhatsApp...</p>
        </div>
    </div>

    <script>
        function procesarCupon(producto, codigo) {
            document.getElementById('codigoBox').innerText = codigo;
            document.getElementById('miModal').style.display = 'flex';
            setTimeout(function() {
                var telefono = "5356682831";
                var mensaje = "¡Hola! Me interesa reservar el producto: " + producto + " con el cupón de descuento: " + codigo + ". Me encuentro en Pinar del Río Ciudad para coordinar la recogida.";
                window.location.href = "https://api.whatsapp.com/send?phone=" + telefono + "&text=" + encodeURIComponent(mensaje);
            }, 2500);
        }
    </script>
</body>
</html>
